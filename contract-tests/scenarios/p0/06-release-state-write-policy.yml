      PK: "RELEASE#service-a"
      SK: "EVENT#2026-04-24T19:00:00Z"
      eventType: "mutated"
    expect:
      error: "ErrImmutableModelMutation"

  - op: save
    item:
      PK: "RELEASE#service-a"
      SK: "EVENT#2026-04-24T19:00:00Z"
      releaseId: "rel_001"
      eventType: "overwritten"
    expect:
      error: "ErrImmutableModelMutation"

  - op: delete
    key:
      PK: "RELEASE#service-a"
      SK: "EVENT#2026-04-24T19:00:00Z"
    expect:
      error: "ErrImmutableModelMutation"
