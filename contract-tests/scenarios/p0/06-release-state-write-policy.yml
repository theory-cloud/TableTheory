model: "ReleaseStateEvent"
table:
  name: "release_state_contract"
steps:
  - op: create
    if_not_exists: true
    item:
      PK: "RELEASE#service-a"
      SK: "EVENT#2026-04-24T19:00:00Z"
      releaseId: "rel_001"
      eventType: "promoted"
