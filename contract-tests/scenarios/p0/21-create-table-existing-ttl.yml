name: "p0.schema.create_table_existing_ttl"
dms_version: "0.2"
model: "User"
table:
  name: "users_contract"
steps:
  # The runner provisions the table before the steps. The first CreateTable
  # meets an existing table without TTL and enables TTL from the model.
  - op: create_table
    expect:
      ok: true

  # The second CreateTable meets the same table with TTL already enabled on the
  # model attribute. It must return the already-exists outcome (no error), not a
  # TimeToLive ValidationException.
  - op: create_table
    expect:
      ok: true
