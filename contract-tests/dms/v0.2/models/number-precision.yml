dms_version: "0.2"
namespace: "theorydb.contract"
models:
  - name: "NumberPrecision"
    table:
      name: "number_precision_contract"
    naming:
      convention: "camelCase"
    keys:
      partition: { attribute: "PK", type: "S" }
      sort: { attribute: "SK", type: "S" }
    attributes:
      - attribute: "PK"
        type: "S"
        required: true
        roles: ["pk"]
      - attribute: "SK"
        type: "S"
        required: true
        roles: ["sk"]
      - attribute: "largeInteger"
        type: "N"
        format: "decimal_string"
      - attribute: "preciseDecimal"
        type: "N"
        format: "decimal_string"
