dms_version: "0.2"
namespace: "theorydb.contract.release_state"
models:
  - name: "ReleaseStateActual"
    table:
      name: "release_state_contract"
    naming:
      convention: "camelCase"
    keys:
      partition: { attribute: "PK", type: "S" }
      sort: { attribute: "SK", type: "S" }
    write_policy:
      mode: "mutable"
      protected_attributes: ["pinnedReleaseId"]
    attributes:
      - attribute: "PK"
        type: "S"
        required: true
        roles: ["pk"]
      - attribute: "SK"
        type: "S"
        required: true
        roles: ["sk"]
      - attribute: "status"
        type: "S"
        optional: true
        omit_empty: true
      - attribute: "pinnedReleaseId"
        type: "S"
        optional: true
        omit_empty: true
      - attribute: "previousReleaseId"
        type: "S"
        optional: true
        omit_empty: true
      - attribute: "provenance"
        type: "M"
        json: true
        optional: true
        omit_empty: true
      - attribute: "confidence"
        type: "M"
        json: true
        optional: true
        omit_empty: true
      - attribute: "updatedAt"
        type: "S"
        format: "rfc3339nano"
        roles: ["updated_at"]
      - attribute: "version"
        type: "N"
        format: "int"
        roles: ["version"]

  - name: "ReleaseStateEvent"
    table:
      name: "release_state_contract"
    naming:
      convention: "camelCase"
    keys:
      partition: { attribute: "PK", type: "S" }
      sort: { attribute: "SK", type: "S" }
    write_policy:
      mode: "write_once"
      protected_attributes: []
    attributes:
      - attribute: "PK"
        type: "S"
        required: true
        roles: ["pk"]
      - attribute: "SK"
        type: "S"
        required: true
        roles: ["sk"]
      - attribute: "releaseId"
        type: "S"
        optional: true
        omit_empty: true
      - attribute: "eventType"
        type: "S"
        optional: true
        omit_empty: true
      - attribute: "provenance"
        type: "M"
        json: true
        optional: true
        omit_empty: true
      - attribute: "confidence"
        type: "M"
        json: true
        optional: true
        omit_empty: true
      - attribute: "recordedAt"
        type: "S"
        format: "rfc3339nano"
        optional: true
        omit_empty: true
      - attribute: "ttl"
        type: "N"
        format: "unix_seconds"
        roles: ["ttl"]
        optional: true
        omit_empty: true
