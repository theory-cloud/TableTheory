# =============================================================
# TableTheory sidebar navigation
# =============================================================
# Each group has a label and a list of items.
# Each item:
#   id     — stable identifier (used for prev/next + page lookups)
#   title  — sidebar label
#   url    — Jekyll-relative URL (will be prefixed with site.baseurl)
#   icon   — lucide-style icon id rendered by _includes/icon.html
#   tag    — optional: new | beta | ga
#   surface — optional: overrides the page surface (e.g. mcp for the
#             MCP Memory integration page)
#
# Adding a new page: create the markdown file under docs/ and add an
# entry here. Update `order` below if it should appear in prev/next.
# =============================================================

groups:
  - label: Overview
    items:
      - { id: home,                  title: Welcome,                 url: /,                                  icon: home }
      - { id: getting-started,       title: Getting Started,         url: /getting-started/,                  icon: play }
      - { id: api-reference,         title: API Reference,           url: /api-reference/,                    icon: book,        tag: ga }
      - { id: architecture-patterns, title: Architecture Patterns,   url: /architecture-patterns/,            icon: compass }

  - label: Modeling
    items:
      - { id: struct-definition,     title: Struct Definition,       url: /struct-definition-guide/,          icon: layout }
      - { id: development-guidelines, title: Development Guidelines, url: /development-guidelines/,           icon: check-square }
      - { id: core-patterns,         title: Core Patterns,           url: /core-patterns/,                    icon: compass }
      - { id: release-state,         title: Release State Patterns,  url: /release-state-patterns/,           icon: tag }

  - label: Runtimes
    items:
      - { id: runtime-go,            title: Go,                      url: /runtimes/go/,                      icon: go-mark,     tag: ga }
      - { id: runtime-ts,            title: TypeScript,              url: /runtimes/typescript/,              icon: ts-mark,     tag: ga }
      - { id: runtime-py,            title: Python,                  url: /runtimes/python/,                  icon: py-mark,     tag: ga }


  - label: Runtime Guides
    items:
      - { id: ts-getting-started,     title: TS Getting Started,     url: /runtimes/typescript/getting-started/,     icon: ts-mark }
      - { id: ts-api-reference,       title: TS API Reference,       url: /runtimes/typescript/api-reference/,       icon: book }
      - { id: ts-core-patterns,       title: TS Core Patterns,       url: /runtimes/typescript/core-patterns/,       icon: compass }
      - { id: ts-testing-guide,       title: TS Testing,             url: /runtimes/typescript/testing-guide/,       icon: check }
      - { id: ts-troubleshooting,     title: TS Troubleshooting,     url: /runtimes/typescript/troubleshooting/,     icon: life-buoy }
      - { id: ts-migration-guide,     title: TS Migration,           url: /runtimes/typescript/migration-guide/,     icon: arrow-right }
      - { id: ts-release-state,       title: TS Release State,       url: /runtimes/typescript/release-state/,       icon: tag }
      - { id: py-getting-started,     title: Py Getting Started,     url: /runtimes/python/getting-started/,         icon: py-mark }
      - { id: py-api-reference,       title: Py API Reference,       url: /runtimes/python/api-reference/,           icon: book }
