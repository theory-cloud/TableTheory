      - { id: migration-v3-0-5-create, title: v3.0.5 Create Migration, url: /migration/v3.0.5-create/,           icon: git-branch }
      - { id: llm-faq,               title: LLM FAQ,                 url: /llm-faq/module-faq/,               icon: help-circle }

  - label: Reference
