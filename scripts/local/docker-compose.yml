# Checked-in local profile for `make examples-local`.
#
# Every service publishes on an ephemeral loopback port: the compose file says
# `127.0.0.1::<container port>`, Docker picks the host port, and the harness
# reads it back with `docker compose port`. Combined with the per-run compose
# project name, two harness instances on one host (for example an implementer
# and a reviewer in different checkouts) never share a container, a network or
# a port. Nothing in this profile is meant to be configured by an operator at
# run time.
#
# Images are pinned by digest, not by tag, so a moved tag cannot silently change
# what the harness runs. The tag that produced each digest is recorded in
# docs/examples/local-harness.md.
#
# The in-memory backends are deliberately ephemeral: every harness run starts
# from empty services, so examples cannot depend on state left behind by an
# earlier run or by another checkout.
services:
  dynamodb-local:
    image: amazon/dynamodb-local@sha256:7ef4a2c45b58c2901e70a4f28e0953a422c2c631baaaf5e2c15e0805740c7752
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "127.0.0.1::8000"
    restart: "no"

  # KMS and STS run in one moto process: the harness routes both service
  # endpoints to this container.
  moto:
    image: motoserver/moto@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
    ports:
      - "127.0.0.1::5000"
    restart: "no"

  # s3proxy enforces the same SigV4 the SDK sends, against the harness's static
  # dummy identity. The filesystem backend lives inside the container.
  s3proxy:
    image: andrewgaul/s3proxy@sha256:1f8915c2b4a8af22bf1fc191500f242974a458c457391b5788f9107544273dc3
    environment:
      S3PROXY_AUTHORIZATION: "aws-v2-or-v4"
      S3PROXY_IDENTITY: "dummy"
      S3PROXY_CREDENTIAL: "dummy"
    ports:
      - "127.0.0.1::80"
    restart: "no"

  elasticmq:
    image: softwaremill/elasticmq-native@sha256:e4580ab9ad1bd5cd37b4ba04911bc5ccc8cd2d9ab4de56ece65acee71c24e05c
    ports:
      - "127.0.0.1::9324"
    restart: "no"
