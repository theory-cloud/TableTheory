name: TypeScript (TS)

on:
  push:
    branches: ["staging", "premain", "main"]
  pull_request:
    # `staging` is listed because the push-to-`staging` run of this job is a
    # gate the `staging` -> `premain` promotion depends on. While staging PRs
    # skipped it, a PR could merge green and its own merge commit then fail
    # this job on the push to `staging` and on the promotion PR (#623). Quality
    # Gates also covers the TypeScript surface on staging PRs, so this
    # duplicates suite time deliberately: no promotion may fail on a gate the
    # PR never ran.
    branches: ["staging", "premain", "main"]
    paths-ignore:
      - ".release-please-manifest.json"
      - "CHANGELOG.md"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ts:
    runs-on: ubuntu-latest
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:3.1.0
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -s http://localhost:8000 >/dev/null || exit 1"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 24
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install dependencies
        run: npm --prefix ts ci --ignore-scripts

      - name: Format check
        run: npm --prefix ts run format:check

      - name: Lint
        run: npm --prefix ts run lint

      - name: Typecheck
        run: npm --prefix ts run typecheck

      - name: Build
        run: npm --prefix ts run build

      - name: Unit tests
        run: npm --prefix ts run test:unit

      - name: Coverage (unit)
        run: bash scripts/verify-coverage.sh --language typescript --suite unit --record-only

      - name: Integration test
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          DYNAMODB_ENDPOINT: http://localhost:8000
        run: npm --prefix ts run test:integration

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ts_coverage-${{ matrix.node-version }}
          path: ts/coverage
          if-no-files-found: ignore
