name: TypeScript (TS)

on:
  push:
    branches: ["staging", "premain", "main"]
  pull_request:
    # Staging PRs run TypeScript through Quality Gates to avoid duplicate suites.
    branches: ["premain", "main"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ts:
    runs-on: ubuntu-latest
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:3.1.0
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -s http://localhost:8000 >/dev/null || exit 1"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 24
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install dependencies
        run: npm --prefix ts ci

      - name: Format check
        run: npm --prefix ts run format:check

      - name: Lint
        run: npm --prefix ts run lint

      - name: Typecheck
        run: npm --prefix ts run typecheck

      - name: Build
        run: npm --prefix ts run build

      - name: Unit tests
        run: npm --prefix ts run test:unit

      - name: Coverage (unit)
        run: bash scripts/coverage-ts.sh unit

      - name: Integration test
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          DYNAMODB_ENDPOINT: http://localhost:8000
        run: npm --prefix ts run test:integration

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ts_coverage-${{ matrix.node-version }}
          path: ts/coverage
          if-no-files-found: ignore
