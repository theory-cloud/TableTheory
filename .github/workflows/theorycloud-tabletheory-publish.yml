name: TableTheory TheoryCloud subtree publish

# Trigger set (kept deliberately tight):
#
#   push -> premain/main, limited to the published subtree content, the subtree
#     tooling this job executes, the trigger helper, and the pinned publish
#     tooling this job installs (scripts/requirements/theorycloud-publish.in and
#     scripts/requirements/theorycloud-publish.txt). A change to the dependency
#     lock changes what this job installs, so it must re-run this job exactly
#     like a change to the subtree content does: a hash-lock repair that fixes a
#     failed publish must not merge without re-executing the publish it repairs.
#
#   workflow_dispatch -> premain/main only, for the case the push filter cannot
#     cover: re-running a publish that failed, or that a later push superseded,
#     without re-running the old commit. It takes no inputs and no separate ref
#     parameter; the run checks out and publishes the ref it is dispatched on,
#     and the "Resolve publish target branch" step below fails closed on any ref
#     outside premain/main before any checkout, install, or role assumption.
on:
  push:
    branches:
      - premain
      - main
    paths:
      - "docs/README.md"
      - "docs/_concepts.yaml"
      - "docs/_decisions.yaml"
      - "docs/_patterns.yaml"
      - "docs/api-reference.md"
      - "docs/architecture-patterns.md"
      - "docs/core-patterns.md"
      - "docs/getting-started.md"
      - "docs/migration-guide.md"
      - "docs/struct-definition-guide.md"
      - "docs/testing-guide.md"
      - "docs/troubleshooting.md"
      - "docs/cdk/**"
      - "docs/facetheory/**"
      - "docs/llm-faq/**"
      - "ts/docs/README.md"
      - "ts/docs/_concepts.yaml"
      - "ts/docs/_decisions.yaml"
      - "ts/docs/_patterns.yaml"
      - "ts/docs/api-reference.md"
      - "ts/docs/core-patterns.md"
      - "ts/docs/getting-started.md"
      - "ts/docs/migration-guide.md"
      - "ts/docs/testing-guide.md"
      - "ts/docs/troubleshooting.md"
      - "py/docs/README.md"
      - "py/docs/_concepts.yaml"
      - "py/docs/_decisions.yaml"
      - "py/docs/_patterns.yaml"
      - "py/docs/api-reference.md"
      - "py/docs/core-patterns.md"
      - "py/docs/getting-started.md"
      - "py/docs/migration-guide.md"
      - "py/docs/testing-guide.md"
      - "py/docs/troubleshooting.md"
      - "scripts/stage_theorycloud_tabletheory_subtree.sh"
      - "scripts/verify-theorycloud-tabletheory-subtree.sh"
      - "scripts/sync_theorycloud_tabletheory_subtree.sh"
      - "scripts/trigger_theorycloud_publish.sh"
      - "scripts/requirements/theorycloud-publish.in"
      - "scripts/requirements/theorycloud-publish.txt"
      - ".github/workflows/theorycloud-tabletheory-publish.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: tabletheory-theorycloud-subtree-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      THEORYCLOUD_STAGE: ${{ github.ref_name == 'premain' && 'lab' || github.ref_name == 'main' && 'live' || '' }}
      AWS_ROLE_ARN: ${{ github.ref_name == 'premain' && 'arn:aws:iam::787107040121:role/KnowledgeTheory-TheoryCloud-TableTheory-lab-Publisher' || github.ref_name == 'main' && 'arn:aws:iam::787107040121:role/KnowledgeTheory-TheoryCloud-TableTheory-live-Publisher' || '' }}
      THEORYCLOUD_TABLETHEORY_SUBTREE_OUTPUT_DIR: /tmp/theorycloud-tabletheory-source
      THEORYCLOUD_PUBLISH_REASON: ${{ format('github:{0}:{1}', github.repository, github.ref_name) }}
    steps:
      - name: Resolve publish target branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail

          # A manual dispatch publishes the ref it is dispatched on, so only the
          # protected release branches may publish; every other ref fails closed
          # here, before the checkout, install, or role-assumption steps below.
          target="${GITHUB_REF_NAME}"
          case "${target}" in
            premain|main)
              ;;
            *)
              echo "theorycloud-publish: FAIL (manual dispatch is limited to premain/main, got ${target:-<empty>})" >&2
              exit 1
              ;;
          esac

      - name: Checkout protected branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate publish workflow configuration
        run: |
          set -euo pipefail

          : "${AWS_REGION:?missing literal AWS_REGION}"
          : "${THEORYCLOUD_STAGE:?missing stage resolution}"
          : "${AWS_ROLE_ARN:?missing stage-scoped AWS role ARN literal}"

          case "${THEORYCLOUD_STAGE}" in
            lab|live) ;;
            *)
              echo "unsupported theorycloud stage: ${THEORYCLOUD_STAGE}" >&2
              exit 1
              ;;
          esac

      - name: Install pinned publish tooling (before role assumption)
        run: |
          set -euo pipefail

          # Install exact, hash-verified tooling BEFORE any AWS role is assumed,
          # so no mutable PyPI dependency (pip itself, awscurl, or a transitive
          # dependency) can execute in the same job that later holds temporary
          # role credentials. --only-binary=:all: forbids building an sdist with
          # its own build backend.
          python3 -m pip install --user --require-hashes --only-binary=:all: \
            -r scripts/requirements/theorycloud-publish.txt
          printf '%s\n' "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Verify staged TableTheory subtree contract
        run: |
          set -euo pipefail

          bash scripts/verify-theorycloud-tabletheory-subtree.sh "${THEORYCLOUD_TABLETHEORY_SUBTREE_OUTPUT_DIR}"

      - name: Assume stage-scoped theorycloud publish role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: tabletheory-${{ github.ref_name }}-${{ github.run_id }}

      - name: Sync TableTheory subtree into shared theorycloud source state
        run: |
          set -euo pipefail

          bash scripts/sync_theorycloud_tabletheory_subtree.sh \
            --stage "${THEORYCLOUD_STAGE}" \
            --output "${THEORYCLOUD_TABLETHEORY_SUBTREE_OUTPUT_DIR}"

      - name: Trigger shared theorycloud publish
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          bash scripts/trigger_theorycloud_publish.sh \
            --stage "${THEORYCLOUD_STAGE}" \
            --source-revision "${SOURCE_REVISION}"
