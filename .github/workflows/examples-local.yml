name: Examples (Local)

# Runs `make examples-local`: the real example code against a DynamoDB Local
# service container, with the harness owning the endpoint and static dummy
# credentials. The job carries no AWS secrets, so nothing here can reach AWS.
on:
  pull_request:
    branches: ["staging"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  examples-local:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:3.1.0
        ports:
          - 8123:8000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.9.26

      - name: Install TypeScript example toolchain
        run: npm --prefix ts ci --ignore-scripts

      - name: Install Python example toolchain
        run: uv --directory py sync --frozen --all-extras

      - name: Run the local examples harness
        run: make examples-local
