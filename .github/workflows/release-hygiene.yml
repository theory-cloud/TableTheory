name: Release Hygiene

on:
  pull_request:
    branches: ["premain", "main"]
  merge_group:
    branches: ["premain", "main"]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted release scripts
        if: github.event_name == 'pull_request'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-release
          persist-credentials: false

      - name: Verify release-hygiene bootstrap scope
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'fix/release-hygiene-main-bootstrap-') && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          mapfile -t changed_files < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[].filename'
          )

          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            echo "release-hygiene-bootstrap: FAIL (bootstrap PR has no changed files)" >&2
            exit 1
          fi

          for changed_file in "${changed_files[@]}"; do
            case "${changed_file}" in
              .github/workflows/release-hygiene.yml|\
              scripts/verify-release-lane-provenance.sh|\
              scripts/verify-promotion-release-driver.sh|\
              scripts/test-release-hygiene-policy.sh|\
              scripts/verify-release-cycle-state.sh|\
              scripts/verify-go-semantic-import-version.sh|\
              scripts/verify-branch-release-supply-chain.sh)
                ;;
              *)
                echo "release-hygiene-bootstrap: FAIL (unexpected bootstrap file ${changed_file})" >&2
                exit 1
                ;;
            esac
          done

          echo "release-hygiene-bootstrap: PASS (${#changed_files[@]} file(s))"

      - name: Verify release-lane same-repository provenance
        if: github.event_name == 'pull_request' && !(github.base_ref == 'main' && startsWith(github.head_ref, 'fix/release-hygiene-main-bootstrap-') && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_STATE: ${{ github.event.pull_request.state }}
          PR_MERGED: ${{ github.event.pull_request.merged || false }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          provenance_args=(
            --repo "${GITHUB_REPOSITORY}" \
            --base "${BASE_REF}" \
            --head "${HEAD_REF}" \
            --base-repo "${BASE_REPOSITORY}" \
            --head-repo "${HEAD_REPOSITORY}" \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --title "${PR_TITLE}"
          )

          if bash trusted-release/scripts/verify-release-lane-provenance.sh --help | grep -Fq -- "--queue-freshness"; then
            provenance_args+=(--queue-freshness)
          else
            echo "release-lane-provenance: trusted base script lacks --queue-freshness; using strict live-ref freshness"
          fi

          bash trusted-release/scripts/verify-release-lane-provenance.sh "${provenance_args[@]}"

      - name: Checkout pull request head after provenance verification
        if: github.event_name == 'pull_request'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - name: Checkout merge queue or workflow dispatch ref
        if: github.event_name != 'pull_request'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve release hygiene target branch
        if: github.event_name != 'pull_request'
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          target="${GITHUB_REF_NAME}"
          queued_head=""
          if [[ "${GITHUB_EVENT_NAME}" == "merge_group" ]]; then
            resolved="$(
              python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path


          def strip_heads_prefix(value: str) -> str:
              return value.removeprefix("refs/heads/")


          def get_path(obj, *parts):
              value = obj
              for part in parts:
                  if isinstance(value, dict):
                      value = value.get(part)
                  elif isinstance(value, list) and isinstance(part, int) and 0 <= part < len(value):
                      value = value[part]
                  else:
                      return ""
              return value if isinstance(value, str) else ""


          def is_queue_ref(value: str) -> bool:
              stripped = strip_heads_prefix(value)
              return stripped.startswith("gh-readonly-queue/")


          def first_payload_head_ref(merge_group: dict) -> tuple[str, str]:
              candidates = [
                  ("merge_group.pull_request.head.ref", get_path(merge_group, "pull_request", "head", "ref")),
                  ("merge_group.pull_request.headRefName", get_path(merge_group, "pull_request", "headRefName")),
                  ("merge_group.pull_requests[0].head.ref", get_path(merge_group, "pull_requests", 0, "head", "ref")),
                  ("merge_group.pull_requests[0].headRefName", get_path(merge_group, "pull_requests", 0, "headRefName")),
                  ("merge_group.pull_requests[0].head_branch", get_path(merge_group, "pull_requests", 0, "head_branch")),
                  ("merge_group.source_ref", get_path(merge_group, "source_ref")),
              ]
              for source, value in candidates:
                  value = strip_heads_prefix(str(value or ""))
                  if value and not is_queue_ref(value):
                      return value, source

              head_ref = strip_heads_prefix(str(merge_group.get("head_ref") or ""))
              if head_ref and not is_queue_ref(head_ref):
                  return head_ref, "merge_group.head_ref"

              return "", ""


          def pr_number_from_queue_ref(merge_group: dict) -> str:
              for value in (str(merge_group.get("head_ref") or ""), os.environ.get("GITHUB_REF", "")):
                  match = re.search(r"(?:^|/)pr-(\d+)(?:[-/]|$)", value)
                  if match:
                      return match.group(1)
              return ""


          def head_ref_from_pr(number: str) -> tuple[str, str]:
              repo = os.environ.get("GITHUB_REPOSITORY", "")
              if not number or not repo or not os.environ.get("GH_TOKEN"):
                  return "", ""
              try:
                  completed = subprocess.run(
                      ["gh", "pr", "view", number, "--repo", repo, "--json", "headRefName"],
                      check=True,
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                  )
                  data = json.loads(completed.stdout)
              except Exception:
                  return "", ""
              head_ref = strip_heads_prefix(str(data.get("headRefName") or ""))
              return (head_ref, f"gh pr view {number}") if head_ref else ("", "")


          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          merge_group = event.get("merge_group", {})
          base_ref = strip_heads_prefix(str(merge_group.get("base_ref") or ""))
          head_ref, head_source = first_payload_head_ref(merge_group)
          if not head_ref:
              head_ref, head_source = head_ref_from_pr(pr_number_from_queue_ref(merge_group))
          print(json.dumps({"branch": base_ref, "head": head_ref, "head_source": head_source}, separators=(",", ":")))
          PY
            )"
            target="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("branch", ""))' <<<"${resolved}")"
            queued_head="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("head", ""))' <<<"${resolved}")"
            queued_head_source="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("head_source", ""))' <<<"${resolved}")"
            if [[ -n "${queued_head}" ]]; then
              echo "release-hygiene: merge_group source head ${queued_head} (${queued_head_source})"
            else
              echo "release-hygiene: merge_group source head unavailable from payload/API"
            fi
          fi

          case "${target}" in
            premain|main)
              ;;
            *)
              echo "release-hygiene: FAIL (unsupported target branch ${target:-<empty>})" >&2
              exit 1
              ;;
          esac

          {
            echo "branch=${target}"
            echo "head=${queued_head}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve release verifier source
        if: github.event_name == 'pull_request'
        id: verifier-source
        working-directory: pr
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          trusted_root="../trusted-release"
          verifier_root="${trusted_root}"
          verifier_label="trusted-base"
          protected_promotion=false

          if [[ "${BASE_REPOSITORY}" == "${EXPECTED_REPOSITORY}" && "${HEAD_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]; then
            case "${BASE_REF}:${HEAD_REF}" in
              premain:staging|main:premain)
                protected_promotion=true
                ;;
            esac
          fi

          add_v2_marker_reason() {
            local root="$1"
            local path="$2"
            local marker="$3"
            local description="$4"
            local -n reasons_ref="$5"

            if [[ ! -f "${root}/${path}" ]]; then
              reasons_ref+=("missing ${path}")
              return
            fi
            if ! grep -Fq -- "${marker}" "${root}/${path}"; then
              reasons_ref+=("${path} lacks ${description}")
            fi
          }

          collect_v2_marker_reasons() {
            local root="$1"
            local reasons_name="$2"
            local -n reasons_ref="${reasons_name}"
            reasons_ref=()

            # These markers distinguish the current single-manifest release lane from
            # older trusted verifier shapes that either required the retired premain
            # manifest/helper/Python path, still assumed numbered-only RC syntax, or
            # had not moved the release-please-action policy from v4 to v5.
            add_v2_marker_reason "${root}" "scripts/verify-release-cycle-state.sh" \
              "scripts/prepare-release-package-versions.py" "package-version stamping marker" "${reasons_name}"
            add_v2_marker_reason "${root}" "scripts/verify-release-cycle-state.sh" \
              "py/src/tabletheory_py/version.json" "canonical Python version marker" "${reasons_name}"
            add_v2_marker_reason "${root}" "scripts/verify-release-cycle-state.sh" \
              "scripts/verify-go-semantic-import-version.sh" "Go semantic import verifier marker" "${reasons_name}"
            add_v2_marker_reason "${root}" "scripts/verify-branch-release-supply-chain.sh" \
              "scripts/prepare-release-package-versions.py" "package-version stamping marker" "${reasons_name}"
            add_v2_marker_reason "${root}" "scripts/verify-branch-release-supply-chain.sh" \
              "scripts/verify-go-semantic-import-version.sh" "Go semantic import supply-chain marker" "${reasons_name}"
            add_v2_marker_reason "${root}" "scripts/verify-branch-release-supply-chain.sh" \
              "single release-please manifest" "single-manifest policy marker" "${reasons_name}"
            add_v2_marker_reason "${root}" "scripts/verify-branch-release-supply-chain.sh" \
              "accept release-please first RC and numbered later RC PR titles" "release-please first-RC PR-title marker" "${reasons_name}"
            add_v2_marker_reason "${root}" "scripts/verify-branch-release-supply-chain.sh" \
              "accept release-please first RC and numbered later RC version syntax" "release-please first-RC version marker" "${reasons_name}"
            add_v2_marker_reason "${root}" "scripts/verify-branch-release-supply-chain.sh" \
              "release-please v5" "release-please-action v5 policy marker" "${reasons_name}"
            add_v2_marker_reason "${root}" "scripts/verify-promotion-release-driver.sh" \
              "manifest-derived stable Release-As" "manifest-derived stable promotion marker" "${reasons_name}"
            add_v2_marker_reason "${root}" "scripts/verify-branch-release-supply-chain.sh" \
              "release-hygiene must run the promotion driver from the resolved verifier source" \
              "resolved promotion-driver supply-chain marker" "${reasons_name}"
            add_v2_marker_reason "${root}" "scripts/verify-branch-release-supply-chain.sh" \
              "scripts/create-stable-release-pr.py" \
              "deterministic stable Release PR marker" "${reasons_name}"
          }

          trusted_reasons=()
          collect_v2_marker_reasons "${trusted_root}" trusted_reasons

          if [[ "${#trusted_reasons[@]}" -eq 0 ]]; then
            echo "release-verifier-source: trusted base supports v2 single-manifest, RC-first, release-please v5, and deterministic stable Release PR verifier markers"
          else
            printf 'release-verifier-source: trusted base lacks v2 single-manifest support, RC-first verifier support, release-please v5 verifier support, or deterministic stable Release PR verifier support (%s)\n' "$(IFS='; '; echo "${trusted_reasons[*]}")"
          fi

          if [[ "${protected_promotion}" == "true" && "${#trusted_reasons[@]}" -ne 0 ]]; then
            head_reasons=()
            collect_v2_marker_reasons "." head_reasons
            if [[ "${#head_reasons[@]}" -ne 0 ]]; then
              printf 'release-verifier-source: FAIL (protected PR head lacks v2 single-manifest support, RC-first verifier support, release-please v5 verifier support, or deterministic stable Release PR verifier support: %s)\n' "$(IFS='; '; echo "${head_reasons[*]}")" >&2
              exit 1
            fi

            verifier_root="."
            verifier_label="protected-pr-head-v2"
            echo "release-verifier-source: protected same-repo promotion may use PR-head v2/RC-first/release-please-v5/deterministic-stable verifier scripts after provenance"
          else
            echo "release-verifier-source: using trusted base verifier scripts"
          fi

          {
            echo "root=${verifier_root}"
            echo "label=${verifier_label}"
          } >> "${GITHUB_OUTPUT}"
          echo "release-verifier-source: selected ${verifier_label} (${verifier_root})"

      - name: Verify human promotion release driver
        if: github.event_name == 'pull_request' && ((github.base_ref == 'premain' && github.head_ref == 'staging') || (github.base_ref == 'main' && github.head_ref == 'premain'))
        working-directory: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          VERIFIER_ROOT: ${{ steps.verifier-source.outputs.root }}
          VERIFIER_LABEL: ${{ steps.verifier-source.outputs.label }}
        run: |
          set -euo pipefail
          echo "promotion-release-driver: using ${VERIFIER_LABEL} verifier source (${VERIFIER_ROOT})"
          bash "${VERIFIER_ROOT}/scripts/verify-promotion-release-driver.sh" \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${GITHUB_BASE_REF}" \
            --head "${GITHUB_HEAD_REF}" \
            --pr "${PR_NUMBER}"

      - name: Verify release cycle state
        if: github.event_name == 'pull_request'
        working-directory: pr
        env:
          RELEASE_CYCLE_ALLOW_PENDING_STABLE_PROMOTION: ${{ github.base_ref == 'main' && github.head_ref == 'premain' && 'true' || 'false' }}
          RELEASE_CYCLE_REPO_ROOT: ${{ github.workspace }}/pr
          VERIFIER_ROOT: ${{ steps.verifier-source.outputs.root }}
          VERIFIER_LABEL: ${{ steps.verifier-source.outputs.label }}
        run: |
          set -euo pipefail
          echo "release-cycle-state: using ${VERIFIER_LABEL} verifier source (${VERIFIER_ROOT})"
          bash "${VERIFIER_ROOT}/scripts/verify-release-cycle-state.sh"

      - name: Verify release cycle state
        if: github.event_name != 'pull_request'
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          QUEUE_HEAD_REF: ${{ steps.target.outputs.head }}
        run: |
          set -euo pipefail

          strict_log="$(mktemp)"
          pending_log="$(mktemp)"
          cleanup() {
            rm -f "${strict_log}" "${pending_log}"
          }
          trap cleanup EXIT

          if GITHUB_BASE_REF="${TARGET_BRANCH}" RELEASE_CYCLE_ALLOW_PENDING_STABLE_PROMOTION=false \
            bash scripts/verify-release-cycle-state.sh >"${strict_log}" 2>&1; then
            cat "${strict_log}"
            exit 0
          fi

          if [[ "${TARGET_BRANCH}" == "main" ]] && \
            [[ -n "${QUEUE_HEAD_REF}" ]] && \
            GITHUB_BASE_REF=main GITHUB_HEAD_REF="${QUEUE_HEAD_REF}" RELEASE_CYCLE_ALLOW_PENDING_STABLE_PROMOTION=true \
              bash scripts/verify-release-cycle-state.sh >"${pending_log}" 2>&1; then
            cat "${pending_log}"
            echo "release-hygiene: pending stable promotion accepted on queued main merge group from ${QUEUE_HEAD_REF}"
            exit 0
          fi

          if [[ "${TARGET_BRANCH}" == "main" && -z "${QUEUE_HEAD_REF}" ]]; then
            echo "release-hygiene: FAIL (queued main pending stable promotion could not derive merge_group PR head)" >>"${pending_log}"
          fi

          cat "${strict_log}"
          cat "${pending_log}"
          exit 1

      - name: Verify release supply-chain scaffolding
        if: github.event_name == 'pull_request'
        working-directory: pr
        env:
          VERIFIER_ROOT: ${{ steps.verifier-source.outputs.root }}
          VERIFIER_LABEL: ${{ steps.verifier-source.outputs.label }}
        run: |
          set -euo pipefail
          echo "branch-release: using ${VERIFIER_LABEL} verifier source (${VERIFIER_ROOT})"
          bash "${VERIFIER_ROOT}/scripts/verify-branch-release-supply-chain.sh"

      - name: Verify release supply-chain scaffolding
        if: github.event_name != 'pull_request'
        run: bash scripts/verify-branch-release-supply-chain.sh

      - name: Forbid RC-shaped main Release PRs
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        working-directory: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          bash ../trusted-release/scripts/verify-main-release-pr-postcondition.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --forbid-rc-only

      - name: Forbid RC-shaped main Release PRs
        if: github.event_name != 'pull_request' && steps.target.outputs.branch == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          bash scripts/verify-main-release-pr-postcondition.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --forbid-rc-only
