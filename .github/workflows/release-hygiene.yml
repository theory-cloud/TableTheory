name: Release Hygiene

# Single-source gate (operator ruling 2026-10-12).
#
# Every check in this workflow executes from ONE checkout of the promoted head:
# github.event.pull_request.head.sha for pull requests, the dispatch ref for
# workflow_dispatch. There is no second checkout and no verifier-source
# negotiation; the gate code rides with the head being promoted.
#
# Why: this workflow previously ran provenance from a checkout pinned to the PR
# base SHA and then feature-negotiated the remaining verifiers against
# capability markers in that base checkout. That design deadlocked on its own
# verifier upgrade on 2026-10-12 (PR #681, staging -> premain): the workflow ran
# from the PR head while executing verifiers from the base checkout, whose older
# scripts did not accept the arguments the head workflow passed
# (`--published-baseline`), and the base branch could only receive the newer
# scripts through the very promotion that was blocked. A gate must never be able
# to block the change that fixes it.
#
# Trust-model change, stated plainly: the trusted source of this workflow's code
# is the promoted head instead of the base branch. Controls against gate
# weakening therefore live outside this file: branch protection on `premain` and
# `main` (required status checks, required review, no direct pushes, no merge
# queue), the mandatory human review on every promotion PR, and the visible CI
# on every `staging` PR, which runs this same verifier suite from the head before
# promotion. Nothing here is advisory: every step fails closed.

on:
  pull_request:
    branches: ["premain", "main"]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release hygiene source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false

      - name: Verify release-lane same-repository provenance
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_STATE: ${{ github.event.pull_request.state }}
          PR_MERGED: ${{ github.event.pull_request.merged || false }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          provenance_args=(
            --repo "${GITHUB_REPOSITORY}" \
            --base "${BASE_REF}" \
            --head "${HEAD_REF}" \
            --base-repo "${BASE_REPOSITORY}" \
            --head-repo "${HEAD_REPOSITORY}" \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --title "${PR_TITLE}"
          )

          bash scripts/verify-release-lane-provenance.sh "${provenance_args[@]}"

      - name: Resolve release hygiene target branch
        if: github.event_name == 'workflow_dispatch'
        id: target
        run: |
          set -euo pipefail

          target="${GITHUB_REF_NAME}"
          case "${target}" in
            premain|main)
              ;;
            *)
              echo "release-hygiene: FAIL (unsupported target branch ${target:-<empty>})" >&2
              exit 1
              ;;
          esac

          echo "branch=${target}" >> "${GITHUB_OUTPUT}"

      - name: Resolve highest published release
        id: published
        if: github.event_name == 'pull_request' && ((github.base_ref == 'premain' && github.head_ref == 'staging') || (github.base_ref == 'main' && github.head_ref == 'premain'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The next version candidate must be strictly greater than the highest
          # published release, whatever its origin (Release-As footer, manifest, or
          # release-please computation). The floor is the semver MAXIMUM over every
          # non-draft, non-prerelease release — not the newest-created release,
          # which out-of-order publication can mis-rank, and not a draft, which
          # `--exclude-pre-releases` alone does not drop. `gh release list` also
          # truncates at --limit, so page the REST API until a short page ends the
          # list. Each page body is staged in a temp file and combined with
          # `jq -s 'add'`, so a full 100-release page never travels as a process
          # argument (a full page can exceed the Linux per-argument limit). An
          # empty result means nothing has been published yet (bootstrap); any API,
          # JSON, or semver failure aborts here instead of passing an unchecked
          # baseline downstream.
          page_dir="$(mktemp -d)"
          cleanup_pages() {
            rm -rf "${page_dir}"
          }
          trap cleanup_pages EXIT

          page=1
          page_files=()
          while :; do
            body_file="${page_dir}/page-${page}.json"
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=${page}" >"${body_file}"
            jq -e 'type == "array"' "${body_file}" >/dev/null
            page_files+=("${body_file}")
            if (( $(jq -r 'length' "${body_file}") < 100 )); then
              break
            fi
            page=$((page + 1))
          done
          releases="$(jq -sc 'add' "${page_files[@]}")"
          baseline="$(
            jq -er '
              [ .[] | select(.draft == false and .prerelease == false) | .tag_name ]
              | map(sub("^v"; ""))
              | map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$") | not)) as $bad
              | if ($bad | length) > 0 then
                  error("published stable release tags are not X.Y.Z semver: \($bad | join(", "))")
                else . end
              | sort_by(split(".") | map(tonumber))
              | last // ""
            ' <<<"${releases}"
          )"
          echo "baseline=${baseline}" >> "${GITHUB_OUTPUT}"
          echo "release-hygiene: highest published release baseline: ${baseline:-<none>}"

      - name: Verify human promotion release driver
        if: github.event_name == 'pull_request' && ((github.base_ref == 'premain' && github.head_ref == 'staging') || (github.base_ref == 'main' && github.head_ref == 'premain'))
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_BASELINE: ${{ steps.published.outputs.baseline }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          echo "promotion-release-driver: highest published release baseline: ${PUBLISHED_BASELINE:-<none>}"

          bash scripts/verify-promotion-release-driver.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${GITHUB_BASE_REF}" \
            --head "${GITHUB_HEAD_REF}" \
            --pr "${PR_NUMBER}" \
            --published-baseline "${PUBLISHED_BASELINE}"

      - name: Verify release cycle state
        if: github.event_name == 'pull_request'
        env:
          RELEASE_CYCLE_ALLOW_PENDING_STABLE_PROMOTION: ${{ github.base_ref == 'main' && github.head_ref == 'premain' && 'true' || 'false' }}
          RELEASE_CYCLE_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bash scripts/verify-release-cycle-state.sh

      - name: Verify release cycle state
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          GITHUB_BASE_REF="${TARGET_BRANCH}" RELEASE_CYCLE_ALLOW_PENDING_STABLE_PROMOTION=false \
            bash scripts/verify-release-cycle-state.sh

      - name: Verify release supply-chain scaffolding
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          bash scripts/verify-branch-release-supply-chain.sh

      - name: Verify release supply-chain scaffolding
        if: github.event_name == 'workflow_dispatch'
        run: bash scripts/verify-branch-release-supply-chain.sh

      - name: Forbid RC-shaped main Release PRs
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          bash scripts/verify-main-release-pr-postcondition.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --forbid-rc-only

      - name: Forbid RC-shaped main Release PRs
        if: github.event_name == 'workflow_dispatch' && steps.target.outputs.branch == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          bash scripts/verify-main-release-pr-postcondition.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --forbid-rc-only
