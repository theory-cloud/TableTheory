name: Release Hygiene

# Single-source gate (operator ruling 2026-10-12).
#
# Every check in this workflow executes from ONE checkout of the promoted head:
# the pull request head SHA, or — for a dispatched run — the generated release
# branch head, which scripts/resolve-release-pr-head.sh binds back to the pull
# request head SHA before any check runs. There is no second checkout and no
# verifier-source negotiation; the gate code rides with the head being promoted.
#
# Why: this workflow previously ran provenance from a checkout pinned to the PR
# base SHA and then feature-negotiated the remaining verifiers against
# capability markers in that base checkout. That design deadlocked on its own
# verifier upgrade on 2026-10-12 (PR #681, staging -> premain): the workflow ran
# from the PR head while executing verifiers from the base checkout, whose older
# scripts did not accept the arguments the head workflow passed
# (`--published-baseline`), and the base branch could only receive the newer
# scripts through the very promotion that was blocked. A gate must never be
# able to block the change that fixes it.
#
# Trust-model change, stated plainly: the trusted source of this workflow's code
# is the promoted head instead of the base branch. Controls against gate
# weakening therefore live outside this file: branch protection on `premain` and
# `main` (required status checks, required review, no direct pushes, no merge
# queue), the mandatory human review on every promotion PR, and the visible CI
# on every `staging` PR, which runs this same verifier suite from the head before
# promotion. Nothing here is advisory: every step fails closed.
#
# Eligible events and the ruleset: GitHub evaluates a required status check only
# when the run that reported it was triggered by push, pull_request,
# pull_request_review, pull_request_target, deployment or deployment_status. A
# pull request created or updated with the repository's GITHUB_TOKEN produces
# pull_request runs in an approval-required state, and a run triggered by
# workflow_dispatch reports check runs that never appear in the pull request's
# checks section and never satisfy a required status check. This workflow
# therefore also runs on `pull_request_review: [submitted]` for the release
# bases: the code-owner approval the premain/main rulesets already require is
# the eligible event that makes `hygiene` count, against the reviewed head SHA.
#
# Branch context: every path classifies the release base from the pull request
# context (`pull_request.base.ref`, resolved and provenance-verified below), never
# from GitHub's synthetic `<number>/merge` ref. A review event carries no
# GITHUB_BASE_REF, so the synthetic ref is the only ref GitHub supplies; treating
# it as a branch would misclassify a pending premain -> main promotion.
#
# Dispatch path: it stays, as the release lane's early, head-bound verdict that
# a generated release branch is fit to leave draft. `workflow_dispatch` is the
# documented exception a generated release pull request can reach without a
# credential, so the lane dispatches this workflow against the release branch
# and passes the pull request number. The run is bound to the pull request head
# before any check executes: a run whose ref, SHA, repository or base does not
# match the pull request fails closed. That dispatch does not satisfy the
# ruleset; the code-owner review does.
#
# The context is the job id `hygiene` on every path, because the job declares no
# `name:`, so the ruleset context is the same one everywhere.

on:
  pull_request:
    branches: ["premain", "main"]
  # The one eligible event a generated release pull request reaches without a
  # credential. Restricted to the release bases, so a staging pull request gains
  # no run from this trigger.
  pull_request_review:
    types: [submitted]
    branches: ["premain", "main"]
  workflow_dispatch:
    inputs:
      release_pr_number:
        description: "Generated release pull request number this run verifies"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release hygiene source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both pull_request and pull_request_review carry the head the checks
          # report on; only the dispatch path falls back to the dispatched SHA,
          # which the resolver then binds to the pull request head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Resolve release-lane pull request context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_RELEASE_PR_NUMBER: ${{ inputs.release_pr_number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_STATE: ${{ github.event.pull_request.state }}
          PR_MERGED: ${{ github.event.pull_request.merged || false }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          DISPATCH_REF_NAME: ${{ github.ref_name }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Both pull_request and pull_request_review carry the pull request the
          # checks report on, and both write the same resolved fields. The
          # reviewed head is the same `pull_request.head.sha` the pull_request
          # path checks out and verifies.
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" || "${GITHUB_EVENT_NAME}" == "pull_request_review" ]]; then
            {
              echo "base_ref=${BASE_REF}"
              echo "head_ref=${HEAD_REF}"
              echo "base_repo=${BASE_REPOSITORY}"
              echo "head_repo=${HEAD_REPOSITORY}"
              echo "base_sha=${BASE_SHA}"
              echo "head_sha=${HEAD_SHA}"
              echo "pr_number=${PR_NUMBER}"
              echo "pr_state=${PR_STATE}"
              echo "pr_merged=${PR_MERGED}"
              echo "pr_title=${PR_TITLE}"
            } >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          # The dispatched ref must be the generated release branch this pull
          # request owns, and the dispatched SHA must be its head. Anything else
          # would verify a tree the pull request does not contain. The resolver
          # refuses a closed pull request, a foreign head repository and a
          # non-release base, and it writes every resolved field, including the
          # pull request state the provenance step reads, to GITHUB_OUTPUT.
          bash scripts/resolve-release-pr-head.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --pr "${DISPATCH_RELEASE_PR_NUMBER}" \
            --ref-name "${DISPATCH_REF_NAME}" \
            --ref-sha "${DISPATCH_SHA}" \
            --output "${GITHUB_OUTPUT}" >/dev/null

      - name: Verify the checked-out tree is the resolved pull request head
        run: |
          set -euo pipefail

          checked_out="$(git rev-parse HEAD)"
          if [[ "${checked_out}" != "${{ steps.context.outputs.head_sha }}" ]]; then
            echo "release-hygiene: FAIL (checked out ${checked_out}, resolved pull request head ${{ steps.context.outputs.head_sha }})" >&2
            exit 1
          fi

      - name: Verify release-lane same-repository provenance
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ steps.context.outputs.base_ref }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          BASE_REPOSITORY: ${{ steps.context.outputs.base_repo }}
          HEAD_REPOSITORY: ${{ steps.context.outputs.head_repo }}
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          PR_STATE: ${{ steps.context.outputs.pr_state }}
          PR_MERGED: ${{ steps.context.outputs.pr_merged }}
          PR_TITLE: ${{ steps.context.outputs.pr_title }}
        run: |
          set -euo pipefail

          provenance_args=(
            --repo "${GITHUB_REPOSITORY}" \
            --base "${BASE_REF}" \
            --head "${HEAD_REF}" \
            --base-repo "${BASE_REPOSITORY}" \
            --head-repo "${HEAD_REPOSITORY}" \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --pr "${PR_NUMBER}" \
            --pr-state "${PR_STATE}" \
            --pr-merged "${PR_MERGED}" \
            --title "${PR_TITLE}"
          )

          bash scripts/verify-release-lane-provenance.sh "${provenance_args[@]}"

      - name: Verify generated release pull request head binding
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ steps.context.outputs.base_ref }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          PR_TITLE: ${{ steps.context.outputs.pr_title }}
        run: |
          set -euo pipefail

          bash scripts/verify-release-lane-provenance.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${BASE_REF}" \
            --head "${HEAD_REF}" \
            --base-repo "${GITHUB_REPOSITORY}" \
            --head-repo "${GITHUB_REPOSITORY}" \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --pr "${PR_NUMBER}" \
            --pr-state open \
            --pr-merged false \
            --title "${PR_TITLE}"

      - name: Resolve highest published release
        id: published
        if: (steps.context.outputs.base_ref == 'premain' && steps.context.outputs.head_ref == 'staging') || (steps.context.outputs.base_ref == 'main' && steps.context.outputs.head_ref == 'premain')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The next version candidate must be strictly greater than the highest
          # published release, whatever its origin (Release-As footer, manifest, or
          # release-please computation). The floor is the semver MAXIMUM over every
          # non-draft, non-prerelease release — not the newest-created release,
          # which out-of-order publication can mis-rank, and not a draft, which
          # `--exclude-pre-releases` alone does not drop. `gh release list` also
          # truncates at --limit, so page the REST API until a short page ends the
          # list. Each page body is staged in a temp file and combined with
          # `jq -s 'add'`, so a full 100-release page never travels as a process
          # argument (a full page can exceed the Linux per-argument limit). An
          # empty result means nothing has been published yet (bootstrap); any API,
          # JSON, or semver failure aborts here instead of passing an unchecked
          # baseline downstream.
          page_dir="$(mktemp -d)"
          cleanup_pages() {
            rm -rf "${page_dir}"
          }
          trap cleanup_pages EXIT

          page=1
          page_files=()
          while :; do
            body_file="${page_dir}/page-${page}.json"
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=${page}" >"${body_file}"
            jq -e 'type == "array"' "${body_file}" >/dev/null
            page_files+=("${body_file}")
            if (( $(jq -r 'length' "${body_file}") < 100 )); then
              break
            fi
            page=$((page + 1))
          done
          releases="$(jq -sc 'add' "${page_files[@]}")"
          baseline="$(
            jq -er '
              [ .[] | select(.draft == false and .prerelease == false) | .tag_name ]
              | map(sub("^v"; ""))
              | map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$") | not)) as $bad
              | if ($bad | length) > 0 then
                  error("published stable release tags are not X.Y.Z semver: \($bad | join(", "))")
                else . end
              | sort_by(split(".") | map(tonumber))
              | last // ""
            ' <<<"${releases}"
          )"
          echo "baseline=${baseline}" >> "${GITHUB_OUTPUT}"
          echo "release-hygiene: highest published release baseline: ${baseline:-<none>}"

      - name: Verify human promotion release driver
        if: (steps.context.outputs.base_ref == 'premain' && steps.context.outputs.head_ref == 'staging') || (steps.context.outputs.base_ref == 'main' && steps.context.outputs.head_ref == 'premain')
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_BASELINE: ${{ steps.published.outputs.baseline }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          PR_TITLE: ${{ steps.context.outputs.pr_title }}
        run: |
          set -euo pipefail
          echo "promotion-release-driver: highest published release baseline: ${PUBLISHED_BASELINE:-<none>}"

          bash scripts/verify-promotion-release-driver.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${{ steps.context.outputs.base_ref }}" \
            --head "${{ steps.context.outputs.head_ref }}" \
            --pr "${PR_NUMBER}" \
            --published-baseline "${PUBLISHED_BASELINE}"

      - name: Verify release cycle state
        env:
          # Consume the base/head pair the provenance step already verified
          # against the live pull request. GitHub sets GITHUB_BASE_REF only for
          # pull_request events, so a pull_request_review run would otherwise
          # classify GitHub's synthetic <number>/merge ref as its branch.
          GITHUB_BASE_REF: ${{ steps.context.outputs.base_ref }}
          GITHUB_HEAD_REF: ${{ steps.context.outputs.head_ref }}
          RELEASE_CYCLE_ALLOW_PENDING_STABLE_PROMOTION: ${{ steps.context.outputs.base_ref == 'main' && steps.context.outputs.head_ref == 'premain' && 'true' || 'false' }}
          RELEASE_CYCLE_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bash scripts/verify-release-cycle-state.sh

      - name: Verify release supply-chain scaffolding
        run: |
          set -euo pipefail
          bash scripts/verify-branch-release-supply-chain.sh

      - name: Forbid RC-shaped main Release PRs
        if: steps.context.outputs.base_ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          bash scripts/verify-main-release-pr-postcondition.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --forbid-rc-only

      - name: Verify the generated release PR check lane
        run: |
          set -euo pipefail
          bash scripts/verify-release-pr-check-lane.sh
