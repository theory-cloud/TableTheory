name: Release PR (main)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: release-pr-main
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Forbid RC-shaped main Release PRs
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          bash scripts/verify-main-release-pr-postcondition.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --forbid-rc-only

      - name: Verify release cycle state
        id: cycle
        run: |
          set -euo pipefail

          bash scripts/verify-branch-version-sync.sh

          strict_log="$(mktemp)"
          pending_log="$(mktemp)"
          cleanup() {
            rm -f "${strict_log}" "${pending_log}"
          }
          trap cleanup EXIT

          if bash scripts/verify-release-cycle-state.sh >"${strict_log}" 2>&1; then
            cat "${strict_log}"
            echo "pending_stable_promotion=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if RELEASE_CYCLE_ALLOW_PENDING_STABLE_PROMOTION=true bash scripts/verify-release-cycle-state.sh >"${pending_log}" 2>&1; then
            cat "${pending_log}"
            echo "release-cycle-state: pending stable promotion accepted for stable Release PR generation"
            echo "pending_stable_promotion=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          cat "${strict_log}"
          cat "${pending_log}"
          exit 1

      - name: Compute release-as (normalize single-manifest RC)
        id: version
        if: steps.cycle.outputs.pending_stable_promotion == 'true'
        run: |
          set -euo pipefail

          release_as="$(
            python3 - <<'PY'
          import json
          from pathlib import Path


          manifest = json.loads(Path(".release-please-manifest.json").read_text(encoding="utf-8")).get(".", "")
          if not manifest:
              raise SystemExit("")

          if "-rc" not in manifest:
              raise SystemExit("")

          # A premain -> main promotion carries the single manifest RC forward.
          # The deterministic stable Release PR normalizes that RC baseline to X.Y.Z.
          print(manifest.split("+", 1)[0].split("-", 1)[0])
          PY
          )"

          echo "release_as=${release_as}" >> "${GITHUB_OUTPUT}"
          echo "release-as: ${release_as:-<none>}"

      - name: Resolve highest published release
        id: published
        if: steps.cycle.outputs.pending_stable_promotion == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The next stable version must be strictly greater than the highest
          # published release, no matter how it was computed. The floor is the
          # semver MAXIMUM over every non-draft, non-prerelease release — not the
          # newest-created release, which out-of-order publication can mis-rank,
          # and not a draft, which `--exclude-pre-releases` alone does not drop.
          # `gh release list` also truncates at --limit, so page the REST API
          # until a short page ends the list. An empty result means nothing has
          # been published yet (bootstrap); any API, JSON, or semver failure
          # aborts here instead of passing an unchecked baseline downstream.
          page=1
          releases='[]'
          while :; do
            body="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=${page}")"
            jq -e 'type == "array"' <<<"${body}" >/dev/null
            releases="$(jq -c --argjson page "${body}" '. + $page' <<<"${releases}")"
            if (( $(jq -r 'length' <<<"${body}") < 100 )); then
              break
            fi
            page=$((page + 1))
          done
          baseline="$(
            jq -er '
              [ .[] | select(.draft == false and .prerelease == false) | .tag_name ]
              | map(sub("^v"; ""))
              | map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$") | not)) as $bad
              | if ($bad | length) > 0 then
                  error("published stable release tags are not X.Y.Z semver: \($bad | join(", "))")
                else . end
              | sort_by(split(".") | map(tonumber))
              | last // ""
            ' <<<"${releases}"
          )"
          echo "baseline=${baseline}" >> "${GITHUB_OUTPUT}"
          echo "release-pr: highest published release baseline: ${baseline:-<none>}"

      - name: Create stable Release PR
        if: steps.cycle.outputs.pending_stable_promotion == 'true'
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.release_as }}
          PUBLISHED_BASELINE: ${{ steps.published.outputs.baseline }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${EXPECTED_VERSION}" ]]; then
            echo "stable-release-pr: FAIL (single-manifest pending stable promotion did not compute a stable release-as)"
            exit 1
          fi

          python3 scripts/create-stable-release-pr.py \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head release-please--branches--main \
            --expected-version "${EXPECTED_VERSION}" \
            --published-baseline "${PUBLISHED_BASELINE}"

      - name: Verify stable Release PR postcondition
        if: steps.cycle.outputs.pending_stable_promotion == 'true'
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.release_as }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          bash scripts/verify-main-release-pr-postcondition.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --expected-version "${EXPECTED_VERSION}"
