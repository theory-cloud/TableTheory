name: Release PR (main)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      RELEASE_PLEASE_CLI_VERSION: "17.3.0"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Forbid RC-shaped main Release PRs
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          bash scripts/verify-main-release-pr-postcondition.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --forbid-rc-only

      - name: Verify release cycle state
        id: cycle
        run: |
          set -euo pipefail

          bash scripts/verify-branch-version-sync.sh

          strict_log="$(mktemp)"
          pending_log="$(mktemp)"
          cleanup() {
            rm -f "${strict_log}" "${pending_log}"
          }
          trap cleanup EXIT

          if bash scripts/verify-release-cycle-state.sh >"${strict_log}" 2>&1; then
            cat "${strict_log}"
            echo "pending_stable_promotion=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if RELEASE_CYCLE_ALLOW_PENDING_STABLE_PROMOTION=true bash scripts/verify-release-cycle-state.sh >"${pending_log}" 2>&1; then
            cat "${pending_log}"
            echo "release-cycle-state: pending stable promotion accepted for stable Release PR generation"
            echo "pending_stable_promotion=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          cat "${strict_log}"
          cat "${pending_log}"
          exit 1

      - name: Compute release-as (normalize single-manifest RC)
        id: version
        if: steps.cycle.outputs.pending_stable_promotion == 'true'
        run: |
          set -euo pipefail

          release_as="$(
            python3 - <<'PY'
          import json
          from pathlib import Path


          manifest = json.loads(Path(".release-please-manifest.json").read_text(encoding="utf-8")).get(".", "")
          if not manifest:
              raise SystemExit("")

          if "-rc" not in manifest:
              raise SystemExit("")

          # A premain -> main promotion carries the single manifest RC forward.
          # The stable release-please PR normalizes that RC baseline to X.Y.Z.
          print(manifest.split("+", 1)[0].split("-", 1)[0])
          PY
          )"

          echo "release_as=${release_as}" >> "${GITHUB_OUTPUT}"
          echo "release-as: ${release_as:-<none>}"

      - name: Release Please CLI (PR only)
        env:
          RELEASE_AS: ${{ steps.version.outputs.release_as }}
          PENDING_STABLE_PROMOTION: ${{ steps.cycle.outputs.pending_stable_promotion }}
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${PENDING_STABLE_PROMOTION}" != "true" ]]; then
            echo "release-pr: strict stable state; no single-manifest RC to normalize"
            exit 0
          fi

          if [[ -z "${RELEASE_AS}" ]]; then
            echo "release-pr: FAIL (single-manifest pending stable promotion did not compute a stable release-as)"
            exit 1
          fi

          if [[ -z "${RELEASE_PLEASE_TOKEN}" ]]; then
            echo "release-pr: FAIL (missing release-please token)"
            exit 1
          fi

          args=(
            release-pr
            --repo-url "${GITHUB_REPOSITORY}"
            --target-branch main
            --config-file release-please-config.json
            --manifest-file .release-please-manifest.json
            --token "${RELEASE_PLEASE_TOKEN}"
          )

          args+=(--release-as "${RELEASE_AS}")

          npm ci --prefix scripts/release-please-cli --ignore-scripts
          scripts/release-please-cli/node_modules/.bin/release-please "${args[@]}"

      - name: Verify stable Release PR postcondition
        if: steps.cycle.outputs.pending_stable_promotion == 'true'
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.release_as }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          bash scripts/verify-main-release-pr-postcondition.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --expected-version "${EXPECTED_VERSION}"
