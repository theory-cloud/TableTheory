name: Release PR (main)

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".release-please-manifest.json"
      - "CHANGELOG.md"
      - "py/src/theorydb_py/version.json"
      - "ts/package.json"
      - "ts/package-lock.json"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify release cycle state
        run: |
          set -euo pipefail

          bash scripts/verify-branch-version-sync.sh

          strict_log="$(mktemp)"
          pending_log="$(mktemp)"
          cleanup() {
            rm -f "${strict_log}" "${pending_log}"
          }
          trap cleanup EXIT

          if bash scripts/verify-release-cycle-state.sh >"${strict_log}" 2>&1; then
            cat "${strict_log}"
            exit 0
          fi

          if RELEASE_CYCLE_ALLOW_PENDING_STABLE_PROMOTION=true bash scripts/verify-release-cycle-state.sh >"${pending_log}" 2>&1; then
            cat "${pending_log}"
            echo "release-cycle-state: pending stable promotion accepted for stable Release PR generation"
            exit 0
          fi

          cat "${strict_log}"
          cat "${pending_log}"
          exit 1

      - name: Compute release-as (align to premain RC)
        id: version
        run: |
          set -euo pipefail

          release_as="$(
            python3 - <<'PY'
          import json
          from pathlib import Path


          def parse_base(v: str) -> tuple[int, int, int]:
              v = v.strip()
              if v.startswith("v"):
                  v = v[1:]
              v = v.split("+", 1)[0]
              base = v.split("-", 1)[0]
              parts = base.split(".")
              if len(parts) != 3:
                  raise ValueError(f"invalid semver base: {v}")
              return (int(parts[0]), int(parts[1]), int(parts[2]))


          stable = json.loads(Path(".release-please-manifest.json").read_text(encoding="utf-8")).get(".", "")
          premain = json.loads(Path(".release-please-manifest.premain.json").read_text(encoding="utf-8")).get(".", "")

          if not stable or not premain:
              raise SystemExit("")

          premain_base = premain.split("+", 1)[0].split("-", 1)[0]

          # If premain is already on a higher major/minor/patch line (e.g., 1.3.0-rc.1),
          # force the stable Release PR to promote that baseline (e.g., 1.3.0).
          if parse_base(premain_base) > parse_base(stable):
              print(premain_base)
          PY
          )"

          echo "release_as=${release_as}" >> "${GITHUB_OUTPUT}"
          echo "release-as: ${release_as:-<none>}"

      - name: Release Please (PR only) (aligned)
        if: steps.version.outputs.release_as != ''
        id: release_aligned
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          release-as: ${{ steps.version.outputs.release_as }}
          skip-github-release: true

      - name: Release Please (PR only)
        if: steps.version.outputs.release_as == ''
        id: release_default
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
