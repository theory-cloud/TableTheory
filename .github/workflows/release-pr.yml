name: Release PR (main)

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".release-please-manifest.json"
      - ".release-please-manifest.premain.json"
      - "CHANGELOG.md"
      - "py/src/theorydb_py/version.json"
      - "ts/package.json"
      - "ts/package-lock.json"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      RELEASE_PLEASE_CLI_VERSION: "17.3.0"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Forbid RC-shaped main Release PRs
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          bash scripts/verify-main-release-pr-postcondition.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --forbid-rc-only

      - name: Verify release cycle state
        id: cycle
        run: |
          set -euo pipefail

          bash scripts/verify-branch-version-sync.sh

          strict_log="$(mktemp)"
          pending_log="$(mktemp)"
          cleanup() {
            rm -f "${strict_log}" "${pending_log}"
          }
          trap cleanup EXIT

          if bash scripts/verify-release-cycle-state.sh >"${strict_log}" 2>&1; then
            cat "${strict_log}"
            echo "pending_stable_promotion=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if RELEASE_CYCLE_ALLOW_PENDING_STABLE_PROMOTION=true bash scripts/verify-release-cycle-state.sh >"${pending_log}" 2>&1; then
            cat "${pending_log}"
            echo "release-cycle-state: pending stable promotion accepted for stable Release PR generation"
            echo "pending_stable_promotion=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          cat "${strict_log}"
          cat "${pending_log}"
          exit 1

      - name: Compute release-as (align to premain RC)
        id: version
        run: |
          set -euo pipefail

          release_as="$(
            python3 - <<'PY'
          import json
          from pathlib import Path


          def parse_base(v: str) -> tuple[int, int, int]:
              v = v.strip()
              if v.startswith("v"):
                  v = v[1:]
              v = v.split("+", 1)[0]
              base = v.split("-", 1)[0]
              parts = base.split(".")
              if len(parts) != 3:
                  raise ValueError(f"invalid semver base: {v}")
              return (int(parts[0]), int(parts[1]), int(parts[2]))


          stable = json.loads(Path(".release-please-manifest.json").read_text(encoding="utf-8")).get(".", "")
          premain = json.loads(Path(".release-please-manifest.premain.json").read_text(encoding="utf-8")).get(".", "")

          if not stable or not premain:
              raise SystemExit("")

          premain_base = premain.split("+", 1)[0].split("-", 1)[0]

          if "-rc" not in premain:
              raise SystemExit("")

          # Pending stable promotion is promoted from an RC baseline
          # (e.g., 1.3.0-rc.1 -> release-as 1.3.0).
          if parse_base(premain_base) > parse_base(stable):
              print(premain_base)
          PY
          )"

          echo "release_as=${release_as}" >> "${GITHUB_OUTPUT}"
          echo "release-as: ${release_as:-<none>}"

      - name: Release Please CLI (PR only)
        env:
          RELEASE_AS: ${{ steps.version.outputs.release_as }}
          PENDING_STABLE_PROMOTION: ${{ steps.cycle.outputs.pending_stable_promotion }}
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${PENDING_STABLE_PROMOTION}" != "true" ]]; then
            echo "release-pr: strict stable state; no release-as computed and no release-please call needed"
            exit 0
          fi

          if [[ -z "${RELEASE_AS}" ]]; then
            echo "release-pr: FAIL (pending stable promotion did not compute a stable release-as)"
            exit 1
          fi

          if [[ -z "${RELEASE_PLEASE_TOKEN}" ]]; then
            echo "release-pr: FAIL (missing release-please token)"
            exit 1
          fi

          args=(
            release-pr
            --repo-url "${GITHUB_REPOSITORY}"
            --target-branch main
            --config-file release-please-config.json
            --manifest-file .release-please-manifest.json
            --token "${RELEASE_PLEASE_TOKEN}"
          )

          args+=(--release-as "${RELEASE_AS}")

          npx --yes "release-please@${RELEASE_PLEASE_CLI_VERSION}" "${args[@]}"

      - name: Verify stable Release PR postcondition
        if: steps.cycle.outputs.pending_stable_promotion == 'true'
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.release_as }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          bash scripts/verify-main-release-pr-postcondition.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --expected-version "${EXPECTED_VERSION}"
