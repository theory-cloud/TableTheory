name: Release (main)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for release state verification)
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Classify release cycle state
        if: github.ref == 'refs/heads/main'
        id: cycle
        run: |
          set -euo pipefail

          bash scripts/verify-branch-version-sync.sh

          strict_log="$(mktemp)"
          pending_log="$(mktemp)"
          cleanup() {
            rm -f "${strict_log}" "${pending_log}"
          }
          trap cleanup EXIT

          if bash scripts/verify-release-cycle-state.sh >"${strict_log}" 2>&1; then
            cat "${strict_log}"
            echo "pending_stable_promotion=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if RELEASE_CYCLE_ALLOW_PENDING_STABLE_PROMOTION=true bash scripts/verify-release-cycle-state.sh >"${pending_log}" 2>&1; then
            cat "${pending_log}"
            echo "pending_stable_promotion=true" >> "${GITHUB_OUTPUT}"
            {
              echo "### Stable release skipped"
              echo
              echo "Pending stable promotion detected. release-pr.yml must open the stable release-please PR; stable release creation resumes only after that PR merges and strict equality is restored."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          cat "${strict_log}"
          cat "${pending_log}"
          exit 1

      - name: Skip stable release during pending promotion
        if: github.ref == 'refs/heads/main' && steps.cycle.outputs.pending_stable_promotion == 'true'
        run: |
          echo "release-cycle-state: pending stable promotion detected; stable release creation is skipped until the stable release-please PR merges"

      - name: Release Please (Stable)
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cycle.outputs.pending_stable_promotion != 'true'
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # PR generation runs in release-pr.yml.
          skip-github-pull-request: true

      - name: Verify stable publish postcondition
        if: github.ref == 'refs/heads/main'
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PENDING_STABLE_PROMOTION: ${{ steps.cycle.outputs.pending_stable_promotion || 'false' }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created || 'false' }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail

          bash scripts/verify-release-created-postcondition.sh \
            --kind stable \
            --branch "${GITHUB_REF_NAME}"

      - name: Checkout (for release assets)
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go (from go.mod)
        if: steps.release.outputs.release_created == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Set up Node (24)
        if: steps.release.outputs.release_created == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Set up Python (3.14)
        if: steps.release.outputs.release_created == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install uv (pinned)
        if: steps.release.outputs.release_created == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.9.26

      - name: Build release assets (ts npm pack + py wheel/sdist)
        if: steps.release.outputs.release_created == 'true'
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          if [[ -z "${TAG_NAME}" ]]; then
            echo "release-assets: FAIL (missing tag_name output)"
            exit 1
          fi

          rm -rf release-assets
          mkdir -p release-assets

          python3 scripts/prepare-release-package-versions.py --tag-name "${TAG_NAME}"

          pushd ts
          npm ci
          npm run build
          npm pack --pack-destination ../release-assets
          popd

          pushd py
          uv sync --frozen --all-extras
          uv run python -m build --outdir ../release-assets
          popd

          # tabletheory CLI binaries (linux/mac, amd64/arm64).
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -trimpath -ldflags="-s -w" \
              -o "release-assets/tabletheory-${os}-${arch}" ./cmd/tabletheory
          done
          ( cd release-assets && sha256sum tabletheory-linux-* tabletheory-darwin-* > tabletheory-SHA256SUMS.txt )

          python3 scripts/verify-release-package-version-assets.py \
            --tag-name "${TAG_NAME}" \
            --assets-dir release-assets

          ls -la release-assets

      - name: Upload release assets
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          if [[ -z "${TAG_NAME}" ]]; then
            echo "release-assets: FAIL (missing tag_name output)"
            exit 1
          fi

          mapfile -t existing_assets < <(gh release view "${TAG_NAME}" --json assets --jq '.assets[].name' 2>/dev/null || true)

          for asset_path in release-assets/*; do
            asset_name="$(basename "${asset_path}")"
            if printf '%s\n' "${existing_assets[@]}" | grep -Fxq "${asset_name}"; then
              echo "release-assets: skip existing ${asset_name}"
              continue
            fi
            gh release upload "${TAG_NAME}" "${asset_path}"
          done

      - name: Publish release (immutable)
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          if [[ -z "${TAG_NAME}" ]]; then
            echo "release-assets: FAIL (missing tag_name output)"
            exit 1
          fi
          gh release edit "${TAG_NAME}" --draft=false
