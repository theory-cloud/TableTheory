name: Quality Gates (10/10 Rubric)

on:
  pull_request:
    branches: ["staging"]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  rubric:
    runs-on: ubuntu-latest
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:3.1.0
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -s http://localhost:8000 >/dev/null || exit 1"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 24
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify staged PR is release-eligible
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "${HEAD_REF}" == "main" ]]; then
            echo "staging-release-driver: PASS (post-release main back-merge)"
            exit 0
          fi
          gh pr view "${PR_NUMBER}" --json title,body,commits > pr.json
          python3 - pr.json <<'PY2'
          import json, re, sys
          pr = json.load(open(sys.argv[1], encoding="utf-8"))
          text = "\n".join([pr.get("title", ""), pr.get("body", "")] + [
              "\n".join((commit.get("messageHeadline", ""), commit.get("messageBody", "")))
              for commit in pr.get("commits", [])
          ])
          if re.search(r"(?m)^(?:feat|fix|perf)(?:\([^)]+\))?!?: ", text):
              print("staging-release-driver: PASS (release-eligible conventional commit)")
              raise SystemExit(0)
          if re.search(r"(?im)^Release-As:[ \t]*v?\d+\.\d+\.\d+-rc(?:\.\d+)?[ \t]*$", text):
              print("staging-release-driver: PASS (explicit RC Release-As driver)")
              raise SystemExit(0)
          raise SystemExit("staging-release-driver: FAIL (staging PR must contain feat:, fix:, or perf:, or an RC-shaped Release-As footer; chore-only work cannot enter the release lane)")
          PY2

      - name: Fetch release-lane refs
        run: |
          git fetch --no-tags --prune origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/premain:refs/remotes/origin/premain \
            +refs/heads/staging:refs/remotes/origin/staging

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install tooling (pinned)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.11

      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Set up Python 3.12 compatibility
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run Python 3.12 pre-merge compatibility
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          DYNAMODB_ENDPOINT: http://localhost:8000
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.9.26
          uv --directory py sync --frozen --all-extras
          uv --directory py run ruff format --check .
          uv --directory py run ruff check .
          uv --directory py run mypy src
          uv --directory py run python -m build
          uv --directory py run pytest -q tests/unit
          uv --directory py run pytest -q tests/integration
          rm -rf py/.venv py/build py/dist
          find py/src -maxdepth 1 -type d -name "*.egg-info" -prune -exec rm -rf {} +

      - name: Set up Node 20 compatibility
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Run Node 20 pre-merge compatibility
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          DYNAMODB_ENDPOINT: http://localhost:8000
        run: |
          npm --prefix ts ci
          npm --prefix ts run check
          npm --prefix ts run test:integration

      - name: Restore Python 3.14 for rubric
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv for rubric (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.9.26

      - name: Restore Node 24 for rubric
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Run rubric
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          DYNAMODB_ENDPOINT: http://localhost:8000
          GOSEC_SARIF_PATH: gosec.sarif
          NPM_AUDIT_ACCEPT_VISIBLE_FINDINGS: "true"
        run: make rubric

      - name: Rubric report (stdout)
        if: always()
        run: bash scripts/print-rubric-summary.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rubric_artifacts
          path: |
            coverage_lib.out
            ts/coverage
            py/coverage.xml
            py/coverage-*.json
            gosec.sarif
            gov-infra/evidence
