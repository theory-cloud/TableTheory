name: Quality Gates (10/10 Rubric)

on:
  pull_request:
    branches: ["staging"]
  merge_group:
    branches: ["staging"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rubric:
    runs-on: ubuntu-latest
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:3.1.0
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -s http://localhost:8000 >/dev/null || exit 1"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 24
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Fetch release-lane refs
        run: |
          git fetch --no-tags --prune origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/premain:refs/remotes/origin/premain \
            +refs/heads/staging:refs/remotes/origin/staging

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install tooling (pinned)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.11

      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Set up Python 3.12 compatibility
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Run Python 3.12 pre-merge compatibility
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          DYNAMODB_ENDPOINT: http://localhost:8000
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.9.26
          uv --directory py sync --frozen --all-extras
          uv --directory py run ruff format --check .
          uv --directory py run ruff check .
          uv --directory py run mypy src
          uv --directory py run python -m build
          uv --directory py run pytest -q tests/unit
          uv --directory py run pytest -q tests/integration
          rm -rf py/.venv py/build py/dist
          find py/src -maxdepth 1 -type d -name "*.egg-info" -prune -exec rm -rf {} +

      - name: Set up Node 20 compatibility
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Run Node 20 pre-merge compatibility
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          DYNAMODB_ENDPOINT: http://localhost:8000
        run: |
          npm --prefix ts ci
          npm --prefix ts run check
          npm --prefix ts run test:integration

      - name: Restore Python 3.14 for rubric
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install uv for rubric (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.9.26

      - name: Restore Node 24 for rubric
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Run rubric
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          DYNAMODB_ENDPOINT: http://localhost:8000
          GOSEC_SARIF_PATH: gosec.sarif
          NPM_AUDIT_ACCEPT_VISIBLE_FINDINGS: "true"
        run: make rubric

      - name: Rubric report (stdout)
        if: always()
        run: bash scripts/print-rubric-summary.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rubric_artifacts
          path: |
            coverage_lib.out
            ts/coverage
            py/coverage.xml
            py/coverage-*.json
            gosec.sarif
            gov-infra/evidence
