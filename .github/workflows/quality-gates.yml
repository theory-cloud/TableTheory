name: Quality Gates (10/10 Rubric)

# staging is where the gates are verified, once, from a locally produced,
# input-bound evidence record. This workflow verifies that record; it executes
# no gate, provisions no toolchain, needs no credential beyond the read-only
# repository token and uploads no artifact.
#
# A missing, stale or failed record fails the job and names the command that
# produces one locally. The record's inputs are content-addressed, so it binds
# the exact tree it was produced against rather than a commit SHA, a branch name
# or an evidence-only commit.
#
# No push trigger: a merge into staging re-verifies nothing. The staging ruleset
# keeps strict up-to-date checks, so the merged tree is the tree this job
# verified.
on:
  pull_request:
    branches: ["staging"]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  # The job id is the required context name. It stays `rubric` so the staging
  # ruleset needs no change, and it now verifies the recorded rubric plus the
  # floor records that no other check covers.
  rubric:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the recorded rubric
        run: bash scripts/evidence/verify-gate.sh --gate rubric --profile default

      # The rubric composes the product gates it re-checks; these three records
      # carry proofs it does not consume (the per-line package suites and the
      # local examples harness), so they are verified here. check-policy.py fails
      # when any declared gate profile has neither path, which is what keeps a
      # produced-but-unverified record out of the tree.
      - name: Verify the recorded TypeScript suite
        run: bash scripts/evidence/verify-gate.sh --gate ts --profile default

      - name: Verify the recorded Python suite
        run: bash scripts/evidence/verify-gate.sh --gate py --profile default

      - name: Verify the recorded examples harness
        run: bash scripts/evidence/verify-gate.sh --gate examples-local --profile default

      # Floor records prove the supported runtimes the default host cannot: they
      # are produced in digest-pinned Linux arm64 containers
      # (scripts/evidence/floor-run.sh) and verified here under their own tracked
      # profile name, so a changed floor or a changed input invalidates only that
      # proof.
      - name: Verify the recorded Node 22 floor
        run: bash scripts/evidence/verify-gate.sh --gate ts --profile floor-node22

      - name: Verify the recorded Python 3.12 floor
        run: bash scripts/evidence/verify-gate.sh --gate py --profile floor-py3.12

      - name: Verify the recorded Linux Go integration floor
        run: bash scripts/evidence/verify-gate.sh --gate go-integration --profile linux-arm64
