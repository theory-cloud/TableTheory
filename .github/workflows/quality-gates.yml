name: Quality Gates (10/10 Rubric)

on:
  pull_request:
    branches: ["staging"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rubric:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install uv (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.9.26

      - name: Install tooling (pinned)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.11

      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run rubric
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          DYNAMODB_ENDPOINT: http://localhost:8000
          GOSEC_SARIF_PATH: gosec.sarif
          NPM_AUDIT_ACCEPT_VISIBLE_FINDINGS: "true"
        run: make rubric

      - name: Rubric report (stdout)
        if: always()
        run: bash scripts/print-rubric-summary.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rubric_artifacts
          path: |
            coverage_lib.out
            ts/coverage
            py/coverage.xml
            py/coverage-*.json
            gosec.sarif
            gov-infra/evidence
