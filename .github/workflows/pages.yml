# =============================================================
# TableTheory · GitHub Pages — Theory Cloud Docs
#
# Builds the Jekyll site under docs/ and deploys it to GitHub Pages.
#
# TRIGGER POLICY (aligned with the repo's publishing-workflow pattern):
#   - release.yml / release-pr.yml ......... trigger on `main`
#   - prerelease.yml / prerelease-pr.yml ... trigger on `premain`
#   - theorycloud-tabletheory-publish.yml .. triggers on `premain` AND `main`
#   - pages.yml (this file) ................ triggers on `staging` ONLY
#
# Pages publish is the *narrowest* of the publish workflows: it never fires
# from `main`, `premain`, pull requests, or feature branches. The GitHub
# Pages environment is protected to allow deployments from `staging` only,
# so the site reflects the integration docs line. Defensive
# `if: github.ref == 'refs/heads/staging'` guards on every job make accidental
# non-staging runs (e.g. via a manual workflow_dispatch from another branch) a
# no-op.
#
# This workflow is independent of release.yml / prerelease.yml /
# quality-gates.yml — it never publishes packages, never mutates tags,
# and never touches the release manifests.
# =============================================================
name: pages

on:
  # Staging is the only branch allowed to publish the Pages site.
  push:
    branches: [staging]
  # Manual re-deploy (e.g. after rotating the Pages environment, or to
  # republish after a docs-only fix that doesn't justify a new commit).
  # Defensive `if:` guards still enforce staging-only at the job level.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Coalesce in-flight deploys: if a second `staging` push lands before the
# previous deploy finishes, queue it (don't cancel) so we never skip a
# commit's publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Jekyll site
    runs-on: ubuntu-latest
    # Belt-and-suspenders: even if someone invokes workflow_dispatch from
    # a non-staging ref, the job no-ops rather than building stale content.
    if: github.ref == 'refs/heads/staging'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Ruby
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Generate Python find-links index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/generate-python-find-links-index.py \
            --repo theory-cloud/TableTheory \
            --output docs/python/find-links/index.html

      - name: Jekyll build
        working-directory: docs
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build \
            --source . \
            --destination ./_site \
            --baseurl ""

      - name: Verify custom-domain root paths
        working-directory: docs
        run: |
          if grep -R -nE --include='*.html' '(href|src)="/(TableTheory|tabletheory)/' ./_site; then
            echo "Found root-relative links with the repository path; custom-domain assets must resolve from /." >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging'
    environment:
      name: github-pages
      url: https://tabletheory.theorycloud.ai/
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
