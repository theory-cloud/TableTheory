# =============================================================
# TableTheory · GitHub Pages — Theory Cloud Docs
#
# Builds the Jekyll site under docs/ and deploys it to GitHub Pages.
#
# TRIGGER POLICY:
#   - push to `staging`: republish the integration docs line from the
#     staging head, stamped with the latest published stable release.
#   - `workflow_dispatch` with an explicit `tag` input: dispatched by
#     release.yml immediately after it publishes a stable release, so the
#     site deploys the just-published tag's docs stamped with that tag —
#     never the previous release. Manual dispatch works too: pass `tag` to
#     deploy a specific stable release, or omit it to redeploy the current
#     ref's docs stamped with the latest stable release.
#
# Why not `release: published`? Releases here are published by
# release-please with the default GITHUB_TOKEN (no PAT secret exists, and
# none may be introduced), and GitHub never triggers new workflow runs from
# GITHUB_TOKEN-created events — a release-event trigger would never fire
# and the site would only update via manual dispatch. workflow_dispatch is
# one of the two event kinds the built-in token IS allowed to create, so
# release.yml hands off explicitly:
# `gh workflow run pages.yml --ref <tag> -f tag=<tag>` from a job holding
# only `actions: write`. No secrets, no manual steps.
#
# Version stamping: the build resolves a tag — the `tag` input, or (push /
# bare manual dispatch) the latest published non-prerelease release via
# `gh release view` — then generates docs/_config_versions.yml via
# scripts/generate-docs-version-override.rb and builds with
# `--config _config.yml,_config_versions.yml`. Jekyll deep-merges config
# hashes but REPLACES arrays wholesale, so the override carries the complete
# tabletheory.runtimes array with every `vX.Y.Z` / `X.Y.Z` placeholder in
# each install string stamped (asset filenames strip the leading `v`). The
# checked-in docs/_config.yml keeps the placeholders and remains the
# local-preview fallback; the override is git-ignored.
#
# The generator runs from the checkout: it is present on `staging` and on
# every release tag cut after this workflow lands. Dispatching with a tag
# older than that fails fast in the generator step — deploy such tags by
# dispatching without `tag` instead.
#
# The github-pages environment's deployment policy accepts the `staging`
# branch and `v*` tag refs, which covers every trigger above; a manual
# dispatch from any other ref is rejected by the environment policy.
#
# This workflow is independent of release.yml / prerelease.yml /
# quality-gates.yml — it never publishes packages, never mutates tags,
# and never touches the release manifests.
# =============================================================
name: pages

on:
  push:
    branches: [staging]
  # Explicit stable tag deploy (release.yml handoff) or manual re-deploy.
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag to deploy (e.g. v3.0.6). Set by release.yml after publishing; leave empty to redeploy this ref's docs stamped with the latest stable release."
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Coalesce in-flight deploys: if a second push or release dispatch lands
# before the previous deploy finishes, queue it (don't cancel) so we never
# skip a publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Jekyll site
    runs-on: ubuntu-latest
    # Pushes deploy from staging only (defense in depth behind the branch
    # trigger); dispatches are ref-gated by the environment policy.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/staging') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Resolve deploy tag and checkout ref
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "${TAG_INPUT}" ]]; then
            # release.yml hands off the tag it just published; manual
            # dispatch may name any stable tag. Prereleases never publish.
            if [[ ! "${TAG_INPUT}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "tag input '${TAG_INPUT}' is not a stable vX.Y.Z tag" >&2
              exit 1
            fi
            resolved_tag="${TAG_INPUT}"
            checkout_ref="${TAG_INPUT}"
          else
            # Push or bare manual dispatch: build this ref's docs and stamp
            # them with the latest published non-prerelease release
            # (`gh release view` resolves GitHub's "latest" release, which
            # excludes drafts and prereleases).
            resolved_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
            checkout_ref=""
          fi
          if [[ -z "${resolved_tag}" ]]; then
            echo "could not resolve a release tag" >&2
            exit 1
          fi
          echo "tag=${resolved_tag}" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=${checkout_ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Explicit tag deploys build the release tag; everything else
          # builds the triggering ref's head (empty = default).
          ref: ${{ steps.tag.outputs.checkout_ref }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Generate version override
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          ruby scripts/generate-docs-version-override.rb \
            --tag "${TAG}" \
            --config docs/_config.yml \
            --output docs/_config_versions.yml

      - name: Generate Python find-links index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/generate-python-find-links-index.py \
            --repo theory-cloud/TableTheory \
            --output docs/python/find-links/index.html

      - name: Jekyll build
        working-directory: docs
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build \
            --config _config.yml,_config_versions.yml \
            --source . \
            --destination ./_site \
            --baseurl ""

      - name: Verify custom-domain root paths
        working-directory: docs
        run: |
          if grep -R -nE --include='*.html' '(href|src)="/(TableTheory|tabletheory)/' ./_site; then
            echo "Found root-relative links with the repository path; custom-domain assets must resolve from /." >&2
            exit 1
          fi

      - name: Verify stamped version in built site
        working-directory: docs
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! grep -qF "theory-cloud-tabletheory-ts-${TAG#v}.tgz" _site/index.html; then
            echo "homepage does not show the stamped TypeScript install URL for tag ${TAG}" >&2
            exit 1
          fi
          if grep -qF 'vX.Y.Z' _site/index.html; then
            echo "homepage still contains un-stamped vX.Y.Z placeholder install URLs" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    # Same guard as the build job.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/staging') || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: https://tabletheory.theorycloud.ai/
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
