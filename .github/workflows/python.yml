name: Python (PY)

on:
  push:
    branches: ["staging", "premain", "main"]
  pull_request:
    # Staging PRs run Python through Quality Gates to avoid duplicate suites.
    branches: ["premain", "main"]
    paths-ignore:
      - ".release-please-manifest.json"
      - "CHANGELOG.md"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  py:
    runs-on: ubuntu-latest
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:3.1.0
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -s http://localhost:8000 >/dev/null || exit 1"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 24
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.9.26

      - name: Install dependencies
        run: uv --directory py sync --frozen --all-extras

      - name: Format check
        run: uv --directory py run ruff format --check .

      - name: Lint
        run: uv --directory py run ruff check .

      - name: Typecheck
        run: uv --directory py run mypy src

      - name: Build
        run: uv --directory py run python -m build

      - name: Unit tests + coverage (unit)
        run: bash scripts/verify-coverage.sh --language python --suite unit --record-only

      - name: Integration test
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          DYNAMODB_ENDPOINT: http://localhost:8000
        run: uv --directory py run pytest -q tests/integration

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: py_coverage-${{ matrix.python-version }}
          path: |
            py/coverage.xml
            py/coverage-unit.txt
          if-no-files-found: ignore
