name: Prerelease PR (premain)

on:
  push:
    branches: ["premain"]
    paths-ignore:
      - ".release-please-manifest.json"
      - "CHANGELOG.md"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Classify release cycle state
        id: cycle
        run: |
          set -euo pipefail

          strict_log="$(mktemp)"
          pending_major_log="$(mktemp)"
          repair_log="$(mktemp)"
          cleanup() {
            rm -f "${strict_log}" "${pending_major_log}" "${repair_log}"
          }
          trap cleanup EXIT

          if {
            bash scripts/verify-branch-version-sync.sh
            bash scripts/verify-release-cycle-state.sh
          } >"${strict_log}" 2>&1; then
            cat "${strict_log}"
            echo "pending_stable_repair=false" >> "${GITHUB_OUTPUT}"
            echo "pending_major_transition=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if {
            bash scripts/verify-branch-version-sync.sh
            TABLETHEORY_PENDING_MAJOR_PREMAIN_CONTEXT=rc-pr-generation \
              bash scripts/verify-release-cycle-state.sh
          } >"${pending_major_log}" 2>&1; then
            cat "${pending_major_log}"
            echo "prerelease-pr: pending semantic import major accepted only for RC PR generation"
            echo "pending_stable_repair=false" >> "${GITHUB_OUTPUT}"
            echo "pending_major_transition=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if bash scripts/verify-premain-pending-stable-repair.sh >"${repair_log}" 2>&1; then
            cat "${repair_log}"
            echo "prerelease-pr: pending stable repair accepted; skipping RC PR generation"
            echo "pending_stable_repair=true" >> "${GITHUB_OUTPUT}"
            echo "pending_major_transition=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          cat "${strict_log}"
          cat "${pending_major_log}"
          cat "${repair_log}"
          exit 1

      - name: Resolve prerelease promotion release driver
        id: driver
        if: steps.cycle.outputs.pending_stable_repair != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_as="$(bash scripts/resolve-prerelease-release-as.sh --repo "${GITHUB_REPOSITORY}" --sha "${GITHUB_SHA}" --base premain)"
          echo "release_as=${release_as}" >> "${GITHUB_OUTPUT}"

      - name: Release Please (PR only)
        id: release
        if: steps.cycle.outputs.pending_stable_repair != 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: premain
          config-file: release-please-config.premain.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
          release-as: ${{ steps.driver.outputs.release_as }}

      - name: Verify prerelease Release PR postcondition
        if: steps.cycle.outputs.pending_stable_repair != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          PRERELEASE_PR_EXPECTED_VERSION: ${{ steps.driver.outputs.release_as }}
        run: |
          set -euo pipefail

          bash scripts/verify-prerelease-pr-postcondition.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --base premain
