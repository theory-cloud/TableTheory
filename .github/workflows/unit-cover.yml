name: Unit Coverage (Short)

on:
  push:
    branches: [ "staging", "premain", "main" ]
  pull_request:
    # `staging` is listed because the `staging` push run of this job is the gate
    # the `staging` -> `premain` promotion depends on: while staging PRs skipped
    # it, PR #622 merged green and its own merge commit then failed this job on
    # the push to staging and on the staging -> premain promotion PR #623.
    branches: [ "staging", "premain", "main" ]
    paths-ignore:
      - ".release-please-manifest.json"
      - "CHANGELOG.md"

permissions:
  contents: read

jobs:
  unit-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # `make unit-cover` runs `go test ./...`, which includes the detached-work
      # guard in ./tests. That guard shells out to
      # tests/detachedwork/scan_typescript.mjs (needs node plus the TypeScript
      # compiler from ts/node_modules) and tests/detachedwork/scan_python.py
      # (needs python3), and it fails closed when either toolchain is missing.
      # Provision both here, pinned like the rest of CI, from the lockfile with
      # install scripts disabled.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install TypeScript scanner toolchain (pinned)
        run: npm --prefix ts ci --ignore-scripts

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run offline unit coverage
        run: make unit-cover

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage_unit
          path: coverage_unit.out
