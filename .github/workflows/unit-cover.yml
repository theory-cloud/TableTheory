name: Unit Coverage (Short)

on:
  push:
    branches: [ "staging", "premain", "main" ]
  pull_request:
    # Staging PRs run Go unit coverage through Quality Gates to avoid duplicate suites.
    branches: [ "premain", "main" ]
    paths-ignore:
      - ".release-please-manifest.json"
      - "CHANGELOG.md"

permissions:
  contents: read

jobs:
  unit-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run offline unit coverage
        run: make unit-cover

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage_unit
          path: coverage_unit.out
