name: Prerelease (premain)

on:
  push:
    branches: ["premain"]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify release cycle state
        run: |
          bash scripts/verify-branch-version-sync.sh
          bash scripts/verify-release-cycle-state.sh

      - name: Release Please (Prerelease)
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: premain
          config-file: release-please-config.premain.json
          manifest-file: .release-please-manifest.premain.json
          # Prevent release-please from opening the *next* prerelease PR on release commits.
          # PR generation runs in prerelease-pr.yml.
          skip-github-pull-request: true

      - name: Checkout (for release assets)
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node (24)
        if: steps.release.outputs.release_created == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Set up Python (3.14)
        if: steps.release.outputs.release_created == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install uv (pinned)
        if: steps.release.outputs.release_created == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.9.26

      - name: Build release assets (ts npm pack + py wheel/sdist)
        if: steps.release.outputs.release_created == 'true'
        run: |
          rm -rf release-assets
          mkdir -p release-assets

          pushd ts
          npm ci
          npm run build
          npm pack --pack-destination ../release-assets
          popd

          pushd py
          uv sync --frozen --all-extras
          uv run python -m build --outdir ../release-assets
          popd

          ls -la release-assets

      - name: Upload release assets
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          if [[ -z "${TAG_NAME}" ]]; then
            echo "release-assets: FAIL (missing tag_name output)"
            exit 1
          fi

          mapfile -t existing_assets < <(gh release view "${TAG_NAME}" --json assets --jq '.assets[].name' 2>/dev/null || true)

          for asset_path in release-assets/*; do
            asset_name="$(basename "${asset_path}")"
            if printf '%s\n' "${existing_assets[@]}" | grep -Fxq "${asset_name}"; then
              echo "release-assets: skip existing ${asset_name}"
              continue
            fi
            gh release upload "${TAG_NAME}" "${asset_path}"
          done

      - name: Publish prerelease (immutable)
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          if [[ -z "${TAG_NAME}" ]]; then
            echo "release-assets: FAIL (missing tag_name output)"
            exit 1
          fi
          gh release edit "${TAG_NAME}" --draft=false --prerelease
